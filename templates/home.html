<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ATTN Home</title>

    <style>
        body {
            background-image: url("/static/images/phenix.webp");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }

        .welcome-screen {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

            background-image: url("/static/images/phenix.webp");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }

        .welcome-content {
            animation: fadeIn 1.2s ease-in-out;
        }

        .main-title {
            font-size: 4rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 12px;
            display: inline-block;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            margin-top: 10px;
            font-size: 1.4rem;
            background: linear-gradient(to right, #e0ffe0, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ---------- BOUTONS IDENTIQUES ---------- */
        .btn {
            display: inline-block;
            width: 260px; /* même largeur pour tous */
            text-align: center;

            margin-top: 30px;
            padding: 18px 0;
            background: #00c97a;
            color: white;
            font-size: 1.3rem;
            border-radius: 50px;
            text-decoration: none;

            box-shadow: 0 5px 25px rgba(0, 255, 150, 0.3);
            transition: 0.3s;

            margin-left: 10px;
            margin-right: 10px;
        }

        .btn:hover {
            background: #00e08d;
            box-shadow: 0 8px 35px rgba(0, 255, 150, 0.5);
            transform: translateY(-3px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

<section class="welcome-screen">
    <div class="welcome-content">
        <h1 class="main-title">🌿 ATTN Ranking System</h1>
        <p class="subtitle">Our attention is the value</p>

        <a href="/leaderboard" class="btn">Leaderboard</a>
        <a href="/insight" class="btn">Insight</a>
    </div>
</section>

</body>
</html>
